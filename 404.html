<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Страница не найдена — Autocat19</title>
  <meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0e0e0e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
    }

    h1 {
      font-size: 80px;
      margin: 0;
    }

    p {
      margin: 20px 0;
      color: #aaa;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #e53935;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.3s;
    }

    a:hover {
      background: #ff4d4d;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>404</h1>
    <p>Страница не найдена</p>
    <p>Возможно, она была удалена или вы ввели неправильный адрес.</p>

    <a href="/">Вернуться на главную</a>
  </div>
</body>
</html>
